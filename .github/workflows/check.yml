name: check

on:
  pull_request:
  push:
    branches: [main]

# The standard's own §12.1: a read-only token, actions pinned to commit SHAs, a pinned
# runner image, and the Node version read from .nvmrc.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: CODING_STANDARDS.md is current and every profile assembles
        run: node scripts/build.mjs --check
